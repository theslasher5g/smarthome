<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    color-scheme:dark;
    --bg:#0a0c11; --bg2:#0f1218;
    --surface:#141821; --surface2:#1b2030; --surface3:#232a3c;
    --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12);
    --text:#eef1f7; --muted:#8b94a8; --faint:#5b6478;
    --accent:#7aa7ff; --accent-soft:rgba(122,167,255,.14);
    --ok:#3ddc97; --ok-soft:rgba(61,220,151,.14);
    --warn:#ffb84d; --warn-soft:rgba(255,184,77,.14);
    --bad:#ff5d6c; --bad-soft:rgba(255,93,108,.14);
    --warm:#ffd37a; --pink:#ff7ab8;
    --wall:#c9d1e3; --room:#1b2030;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px -16px rgba(0,0,0,.6);
    --r:20px;
    --font:"Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 700px at 10% -10%,var(--bg2),var(--bg));color:var(--text);
    font-family:var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1;overflow:hidden}
  .app{height:100vh;height:100dvh;padding:clamp(12px,1.6vw,24px);display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(12px,1.4vw,20px)}

  /* ---------- Kopf ---------- */
  header{display:flex;align-items:center;gap:16px;min-width:0}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
    background:linear-gradient(135deg,var(--accent),#9b7bff);color:#fff;box-shadow:0 8px 20px -8px var(--accent)}
  .logo svg{width:22px;height:22px}
  .brand h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em;line-height:1.15;white-space:nowrap}
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--surface);
    border:1px solid var(--border);font-size:12.5px;color:var(--muted);white-space:nowrap}
  .pill i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
  .pill.ok i{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
  .pill.bad i{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
  .pill.ok{color:var(--text)}
  .clock{text-align:right;line-height:1}
  #time{font-size:clamp(30px,3.2vw,46px);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  #date{margin-top:6px;font-size:13px;color:var(--muted)}

  /* ---------- Raster ---------- */
  main{display:grid;gap:clamp(12px,1.4vw,20px);min-height:0;
    grid-template-columns:minmax(260px,.85fr) minmax(0,1.5fr) minmax(280px,.9fr)}
  .col{display:flex;flex-direction:column;gap:clamp(12px,1.4vw,20px);min-height:0;min-width:0}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);
    padding:clamp(14px,1.3vw,20px);min-height:0;min-width:0;position:relative;display:flex;flex-direction:column}
  .card h2{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card h2 em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:500;font-size:12px;color:var(--faint)}
  .grow{flex:1;min-height:0}

  /* ---------- Räume ---------- */
  #rooms{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;flex:1;scrollbar-width:none}
  #rooms::-webkit-scrollbar{display:none}
  .rm{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:9px 14px;display:grid;
    grid-template-columns:1fr auto;column-gap:12px;row-gap:3px;align-items:end;transition:border-color .3s,background .3s}
  .rm.motion{border-color:rgba(255,122,184,.55)}
  .rm .n{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
  .rm .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bdw{display:flex;gap:6px;flex:none}
  .bd{display:none;align-items:center;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .bd.l{color:var(--warm);background:rgba(255,211,122,.14)}
  .bd.m{color:var(--pink);background:rgba(255,122,184,.14)}
  .bd.c0{color:var(--muted);background:var(--surface3)}
  .bd.c1{color:var(--warn);background:var(--warn-soft)}
  .bd.c2{color:var(--bad);background:var(--bad-soft)}
  .rm .t{font-size:clamp(22px,2.1vw,30px);font-weight:600;letter-spacing:-.03em;line-height:1;white-space:nowrap}
  .rm .h{font-size:16px;font-weight:500;color:var(--muted);white-space:nowrap;padding-bottom:3px}
  .rm .t.bad,.rm .h.bad{color:var(--bad)}
  .rm .bar{grid-column:1/3;height:5px;border-radius:99px;background:var(--surface3);overflow:hidden;margin-top:3px}
  .rm .bar b{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .8s ease}

  /* ---------- Grundriss ---------- */
  .plan-card{flex:1.5}
  .planbox{position:relative;flex:1;min-height:0}
  #plan{position:absolute;inset:0;width:100%;height:100%;display:block}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

  /* ---------- Aktivität ---------- */
  .log-card{flex:.62}
  #log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;overflow:hidden;flex:1;min-height:0;justify-content:flex-end}
  #log li{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0;color:var(--text);
    border-bottom:1px solid var(--border);animation:slide .35s ease both;min-width:0}
  #log li:last-child{border-bottom:0}
  #log li i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
  #log li.w i{background:var(--warn)} #log li.a i{background:var(--bad)}
  #log li time{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
  #log li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes slide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- Info-Kacheln ---------- */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:12px 14px;min-width:0}
  .tile .k{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);font-weight:500}
  .tile .k svg{width:14px;height:14px;flex:none}
  .tile .v{margin-top:8px;font-size:clamp(18px,1.7vw,24px);font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .v.w{color:var(--warn)} .tile .v.r{color:var(--bad)}
  .tile .d{margin-top:3px;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- Netz / System ---------- */
  .net-card{flex:1}
  .stats{display:flex;gap:18px;margin-bottom:10px;font-size:12px;color:var(--muted)}
  .stats b{display:block;margin-top:2px;font-size:17px;font-weight:600;color:var(--text);letter-spacing:-.01em}
  .stats .dn b{color:var(--accent)} .stats .up b{color:var(--pink)}
  #nc{flex:1;min-height:60px;width:100%;display:block}
  .sys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sys div{background:var(--surface2);border-radius:12px;padding:9px 10px;text-align:left;min-width:0}
  .sys span{display:block;font-size:11px;color:var(--muted)}
  .sys b{display:block;margin-top:3px;font-size:15px;font-weight:600;white-space:nowrap}
  .sys .bad b{color:var(--bad)}

  /* ---------- Haus-Status (Chips) ---------- */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 12px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:500;
    background:var(--surface2);color:var(--muted);border:1px solid var(--border);max-width:100%}
  .chip svg{width:14px;height:14px;flex:none}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip.lamp.on{color:var(--warm);background:rgba(255,211,122,.13);border-color:rgba(255,211,122,.3)}
  .chip.win.open{color:var(--warn);background:var(--warn-soft);border-color:rgba(255,184,77,.35)}
  .chip.win.closed{color:var(--ok);background:var(--ok-soft);border-color:transparent}
  .chip.win.warn{color:var(--bad);background:var(--bad-soft);border-color:rgba(255,93,108,.45);animation:chipPulse 1.6s ease-in-out infinite}
  @keyframes chipPulse{50%{box-shadow:0 0 0 5px var(--bad-soft)}}
  .chip.play.on{color:var(--accent);background:var(--accent-soft);border-color:transparent}

  .chip.vent{color:var(--accent);background:var(--accent-soft);border-color:transparent}

  /* ---------- Anwesenheit ---------- */
  .people{display:flex;gap:10px;flex-wrap:wrap}
  .pp{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 7px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);min-width:0}
  .av{width:34px;height:34px;border-radius:50%;background:var(--surface3) center/cover no-repeat;display:grid;place-items:center;
    font-size:13px;font-weight:650;color:var(--muted);flex:none;position:relative}
  .pp.home .av{box-shadow:0 0 0 2px var(--ok)}
  .pp b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
  .pp span{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
  .pp.home span{color:var(--ok)}

  /* ---------- Wetter-Vorschau ---------- */
  .fc{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;overflow:hidden}
  .fh{text-align:center;padding:8px 2px;border-radius:12px;min-width:0}
  .fh.rain{background:var(--accent-soft)}
  .fh time{display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .fh svg{width:24px;height:24px;margin:4px auto 3px;display:block;color:var(--accent)}
  .fh b{display:block;font-size:14px;font-weight:600}
  .fh small{display:block;margin-top:2px;font-size:11px;color:var(--accent);min-height:13px}

  /* ---------- Daten veraltet ---------- */
  .pill.stale{background:var(--bad-soft);color:var(--bad);border-color:rgba(255,93,108,.4);font-weight:600}
  .pill.stale i{background:var(--bad);animation:pulse 1.4s infinite}
  main,.ambient>*{transition:opacity .8s ease,filter .8s ease}
  body.stale main,body.stale .ambient>*{opacity:.38;filter:grayscale(.8)}

  /* ---------- Burn-in-Schutz ---------- */
  .app,.ambient{transform:translate(var(--bx,0px),var(--by,0px));transition:transform 8s ease}
  .ambient{transition:opacity 1.2s ease,visibility 1.2s,transform 8s ease}

  /* ---------- Steuerung (Handy) ---------- */
  .ctl{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .ctlb{appearance:none;-webkit-appearance:none;font:inherit;text-align:left;border:1px solid var(--border);background:var(--surface2);color:var(--text);
    border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:78px;transition:background .2s,transform .1s}
  .ctlb:active{transform:scale(.97)}
  .ctlb b{font-size:14px;font-weight:600} .ctlb span{font-size:12px;color:var(--muted)}
  body.ctrl .col:first-child{order:-2}
  .ctlb.on{background:rgba(255,211,122,.14);border-color:rgba(255,211,122,.35)} .ctlb.on span{color:var(--warm)}

  /* ---------- Ruhige Ansicht (Seiten-Wechsel) ---------- */
  .ambient{position:fixed;inset:0;z-index:15;background:radial-gradient(1200px 700px at 10% -10%,var(--bg2),var(--bg));
    display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,3.4vh,44px);padding:clamp(24px,4.5vw,72px);
    opacity:0;visibility:hidden;pointer-events:none}
  .ambient.show{opacity:1;visibility:visible}
  .amb-top{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap}
  .amb-time{font-size:clamp(80px,15vw,230px);font-weight:600;letter-spacing:-.05em;line-height:.88;font-variant-numeric:tabular-nums}
  .amb-date{margin-top:14px;font-size:clamp(18px,2.4vw,36px);color:var(--muted)}
  .amb-wx{display:flex;align-items:center;gap:clamp(14px,2vw,28px)}
  .amb-ic svg{width:clamp(64px,8vw,130px);height:clamp(64px,8vw,130px);color:var(--accent)}
  .amb-t{font-size:clamp(44px,6.4vw,100px);font-weight:600;letter-spacing:-.04em;line-height:1}
  .amb-c{margin-top:6px;font-size:clamp(16px,2vw,28px);color:var(--muted)}
  .amb-fc{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px}
  .amb-fc .fh{padding:clamp(10px,1.6vh,22px) 4px}
  .amb-fc .fh time{font-size:clamp(13px,1.5vw,20px)}
  .amb-fc .fh svg{width:clamp(28px,3.2vw,48px);height:clamp(28px,3.2vw,48px)}
  .amb-fc .fh b{font-size:clamp(18px,2.2vw,32px)} .amb-fc .fh small{font-size:clamp(12px,1.3vw,18px)}
  .amb-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .amb-tiles .tile{padding:clamp(14px,2vh,24px) clamp(14px,1.6vw,24px);border-radius:20px}
  .amb-tiles .tile .k{font-size:clamp(12px,1.3vw,17px)}
  .amb-tiles .tile .v{font-size:clamp(22px,2.8vw,42px)} .amb-tiles .tile .d{font-size:clamp(12px,1.3vw,17px)}
  .ambient .chips{margin:0}
  @media (max-width:900px){.ambient{display:none}}

  /* ---------- Display dimmen ---------- */
  .dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60;transition:opacity 4s ease}

  /* ---------- Läuft gerade ---------- */
  .now{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;scrollbar-width:none}
  .now::-webkit-scrollbar{display:none}
  .np{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--border);
    border-radius:16px;padding:10px 12px;min-width:0}
  .np .art{width:56px;height:56px;border-radius:12px;background:var(--surface3) center/cover no-repeat;display:grid;place-items:center;color:var(--muted)}
  .np .art svg{width:24px;height:24px}
  .np .tt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np .sb{margin-top:2px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np .rm2{margin-top:5px;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px}
  .np.paused{opacity:.6}
  .eq{display:inline-flex;gap:2px;align-items:flex-end;height:10px}
  .eq i{width:2.5px;background:var(--accent);border-radius:2px;animation:eq 1s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.2s} .eq i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:10px}}
  .dv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);font-size:13px}
  .dv i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft);flex:none}
  .dv em{margin-left:auto;font-style:normal;color:var(--muted);font-size:12px}
  .empty{color:var(--faint);font-size:13px;padding:6px 2px}

  /* ---------- Overlays ---------- */
  .alarm{position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-140%);z-index:30;
    width:min(640px,calc(100vw - 32px));background:var(--bad);color:#fff;border-radius:18px;padding:14px 18px;
    box-shadow:0 20px 50px -12px rgba(255,60,80,.7);display:flex;gap:14px;align-items:center;
    opacity:0;visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s,visibility .45s}
  .alarm.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
  .alarm svg{width:30px;height:30px;flex:none}
  .alarm b{display:block;font-size:17px;letter-spacing:-.01em}
  .alarm span{font-size:13.5px;opacity:.92}
  .alarm .items{display:flex;flex-direction:column;gap:6px;min-width:0}
  .alarmfx{position:fixed;inset:0;pointer-events:none;z-index:25;opacity:0;transition:opacity .4s;
    box-shadow:inset 0 0 0 4px var(--bad),inset 0 0 90px rgba(255,60,80,.45)}
  .alarmfx.show{opacity:1;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}

  .toasts{position:fixed;right:20px;bottom:20px;z-index:20;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  .toast{background:var(--surface);border:1px solid var(--border2);border-left:4px solid var(--warn);border-radius:14px;
    padding:12px 16px;box-shadow:0 20px 40px -16px rgba(0,0,0,.6);max-width:320px;animation:slide .35s ease both}
  .toast.bad{border-left-color:var(--bad)}
  .toast b{display:block;font-size:14px} .toast span{font-size:12.5px;color:var(--muted)}

  .door{position:fixed;inset:0;z-index:28;background:rgba(5,7,10,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:none;align-items:center;justify-content:center;padding:24px}
  .door.show{display:flex}
  .door .box{width:min(820px,100%);background:var(--surface);border:1px solid var(--border2);border-radius:24px;overflow:hidden;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.8);animation:slide .35s ease both}
  .door header{padding:16px 20px;justify-content:space-between}
  .door h3{margin:0;font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px}
  .door .live{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:pulse 1.2s infinite}
  .door .frame{background:#000;aspect-ratio:16/9;display:grid;place-items:center;color:var(--muted);font-size:14px;position:relative}
  .door img{width:100%;height:100%;object-fit:contain;display:block}
  .door .cd{height:4px;background:var(--surface3)} .door .cd b{display:block;height:100%;width:100%;background:var(--accent)}

  @media (max-width:1100px){
    body{overflow:auto}
    .app{height:auto;min-height:100dvh;grid-template-rows:auto auto}
    main{grid-template-columns:1fr 1fr}
    .col:nth-child(2){grid-column:1/3;order:-1}
    .planbox{min-height:340px}
    #log{min-height:150px}
  }
  @media (max-width:700px){
    main{grid-template-columns:1fr}
    .col:nth-child(2){grid-column:auto}
    .brand p,.pill.hide-sm{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></div>
      <div><h1 id="title">Home</h1><p id="sub">Wohnung</p></div>
    </div>
    <div class="spacer"></div>
    <span class="pill stale" id="stale" style="display:none"><i></i><span></span></span>
    <span class="pill hide-sm" id="ha"><i></i><span>Home Assistant</span></span>
    <div class="clock"><div id="time">00:00</div><div id="date"></div></div>
  </header>

  <main>
    <div class="col">
      <section class="card" id="ctlcard" style="display:none">
        <h2>Steuerung <em>Handy</em></h2>
        <div class="ctl" id="ctl"></div>
      </section>
      <section class="card grow">
        <h2>Räume <em id="roomcount"></em></h2>
        <div id="rooms"></div>
      </section>
      <section class="card" id="peoplecard" style="display:none">
        <h2>Anwesenheit <em id="peoplecount"></em></h2>
        <div class="people" id="people"></div>
      </section>
      <section class="card" id="fccard" style="display:none">
        <h2>Wetter <em id="fcnow"></em></h2>
        <div class="fc" id="fc"></div>
      </section>
    </div>

    <div class="col">

  const $ = id => document.getElementById(id);

    const activeAlarms = new Map(), attrs = {}, motionUntil = {}, co2Notice = {};

  const DARK = {bg:'#0a0c11',bg2:'#0f1218',surface:'#141821',surface2:'#1b2030',surface3:'#232a3c',

  const rgba = c => {

    const m = c.match(/[\d.]+/g).map(Number); return [m[0], m[1], m[2], m[3] == null ? 1 : m[3]];
  };
  const withA = (c,a) => { const x = rgba(c); return 'rgba(' + x[0] + ',' + x[1] + ',' + x[2] + ',' + a + ')'; };
  const mix = (a,b,f) => { const x = rgba(a), y = rgba(b); return 'rgba(' + [0,1,2].map(i => Math.round(x[i] + (y[i]-x[i])*f)).join(',') + ',' + (x[3] + (y[3]-x[3])*f).toFixed(3) + ')'; };

  const hm = s => { const a = String(s).split(':').map(Number); return a[0]*60 + (a[1]||0); };

  // 0 = Tag, 1 = Nacht. Abends langsam von darkFrom bis darkFrom+fadeMin, morgens von lightFrom an zurück.
  function darkAmount(){

  function fmtNum(v){

  function discoverBattery(s){

  /* ---------- Bildschirm dimmen ---------- */

  /* Warnung: Fenster offen bei Regen oder Kälte */

  let WINWARN = null, winWarnAt = 0, winWarnKey = '';
  function weatherReason(){

  }

  function render(){

  function push(msg, cls){
    const d = new Date(), li = document.createElement('li');
    if (cls) li.className = cls;
    const dot = document.createElement('i'), tm = document.createElement('time'), sp = document.createElement('span');
    tm.textContent = p2(d.getHours()) + ':' + p2(d.getMinutes()); sp.textContent = msg;
    li.append(dot,tm,sp); log.appendChild(li);
    while (log.children.length > MAX) log.removeChild(log.firstChild);
  }
  push('Dashboard gestartet');

  /* ---------- Toasts ---------- */
  function toast(title, text, life, cls){
    const el = document.createElement('div'); el.className = 'toast' + (cls ? ' ' + cls : '');
    const b = document.createElement('b'), s = document.createElement('span');
    b.textContent = title; s.textContent = text; el.append(b,s); $('toasts').appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = 0; setTimeout(() => el.remove(), 320); }, life || 8000);
  }

  /* ---------- Home Assistant (WebSocket) ---------- */
  const haEl = $('ha');
  function setLink(txt, cls){ haEl.className = 'pill hide-sm ' + (cls||''); haEl.lastElementChild.textContent = txt; }
  setLink('Home Assistant');
  let ws = null, retry = 1500, wasOnline = false, authFailed = false;
  const logged = {}, lastLog = {};
  function applyState(id, st, at){
    values[id] = st;
    if (at){ attrs[id] = at; if (at.unit_of_measurement) units[id] = at.unit_of_measurement; }
  }
  function connect(){
    if (!CONFIG.token || CONFIG.token.indexOf('HIER_') === 0){
      setLink('Kein Token','bad'); push('Home-Assistant-Token fehlt','w'); return;
    }
    setLink('Verbinde …');
    try { ws = new WebSocket(CONFIG.url); } catch(e){ setTimeout(connect, retry); return; }
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
      lastAlive = Date.now();
      if (m.type === 'auth_required'){
        ws.send(JSON.stringify({type:'auth', access_token: CONFIG.token}));
      } else if (m.type === 'auth_ok'){
        wasOnline = true; everOnline = true; retry = 1500;
        setLink('Verbunden','ok'); push('Home Assistant verbunden');
        ws.send(JSON.stringify({id:1, type:'get_states'}));
        ws.send(JSON.stringify({id:2, type:'subscribe_events', event_type:'state_changed'}));
        requestForecast();
      } else if (m.type === 'result' && calls.has(m.id)){
        const nm = calls.get(m.id); calls.delete(m.id);
        if (!m.success) toast('Fehlgeschlagen', nm + ': ' + ((m.error && m.error.message) || 'Fehler'), 6000, 'bad');
      } else if (m.type === 'auth_invalid'){
        authFailed = true; setLink('Token ungültig','bad'); push('Token abgelehnt','a');
      } else if (m.type === 'result' && m.id === 1 && m.success){
        m.result.forEach(s => {
          discoverBattery(s);
          if (!watched.has(s.entity_id)) return;
          applyState(s.entity_id, s.state, s.attributes);
          logged[s.entity_id] = parseFloat(s.state);
          if (motionIds.has(s.entity_id) && s.state === 'on') motionUntil[s.entity_id] = Date.now() + (CONFIG.motionHoldSec||20)*1000;
        });
        CONFIG.alarms.forEach(a => { if (values[a.entity] === (a.on || 'on')) alarmOn(a); });
        render(); infoTick();
      } else if (m.type === 'result' && m.id === fcId){
        gotForecast(m);
      } else if (m.type === 'event' && m.id === 2){
        const d = m.event && m.event.data;
        if (!(d && d.new_state && watched.has(d.entity_id))) return;
        const id = d.entity_id, v = d.new_state.state, old = d.old_state ? d.old_state.state : null, name = String(watched.get(id));
        applyState(id, v, d.new_state.attributes);
        if (motionIds.has(id) && v === 'on'){
          motionUntil[id] = Date.now() + (CONFIG.motionHoldSec||20)*1000; wake();
          if (Date.now() - (lastLog[id]||0) > 60000){ lastLog[id] = Date.now(); push('Bewegung: ' + name); }
        }
        if (lightIds.has(id) && old !== v && (v === 'on' || v === 'off')) push('Licht ' + (v === 'on' ? 'an' : 'aus') + ': ' + name);
        if (winIds.has(id) && old !== v && old != null){ const op = v === 'on' || v === 'open'; push('Fenster ' + (op ? 'geöffnet' : 'geschlossen') + ': ' + name, op ? 'w' : ''); }
        if (PEOPLE.some(pp => pp.entity === id) && old !== v && old != null) { push(name + (v === 'home' ? ' ist zuhause' : ' ist unterwegs')); if (v === 'home') wake(); }
        if (mediaIds.has(id) && old !== v && v === 'playing') push('Wiedergabe: ' + name);
        CONFIG.alarms.forEach(a => { if (a.entity === id){ v === (a.on || 'on') ? alarmOn(a) : alarmOff(id); } });
        if (DB.trigger === id){
          const fire = id.indexOf('event.') === 0 ? (old !== v && v !== 'unavailable' && v !== 'unknown') : (v === 'on' && old !== 'on');
          if (fire) showDoorbell();
        }
        render();
        const num = parseFloat(v);
        if (roomIds.has(id) && isFinite(num) && Math.abs(num - (logged[id]||0)) >= 0.5){
          logged[id] = num;
          const isT = rows.some(x => x.r.temp === id);
          push(name + ': ' + (isT ? num.toFixed(1).replace('.',',') + ' °C' : Math.round(num) + ' % Luftfeuchte'));
        }
      }
    };
    ws.onclose = () => {
      if (authFailed) return;
      if (wasOnline){ wasOnline = false; push('Verbindung zu Home Assistant verloren','w'); }
      setLink('Offline','bad');
      setTimeout(connect, retry); retry = Math.min(retry * 2, 30000);
    };
    ws.onerror = () => {};
  }
  connect();

  /* ---------- Info-Kacheln ---------- */
  const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  const COND = {'clear-night':'Klar','cloudy':'Bewölkt','fog':'Nebel','hail':'Hagel','lightning':'Gewitter','lightning-rainy':'Gewitter mit Regen',
    'partlycloudy':'Heiter','pouring':'Starkregen','rainy':'Regen','snowy':'Schnee','snowy-rainy':'Schneeregen','sunny':'Sonnig','windy':'Windig','windy-variant':'Windig','exceptional':'Ausnahme'};
  function smogData(){
    if (!WX.entity || !(WX.entity in values)) return null;
    const a = attrs[WX.entity] || {}, c = String(values[WX.entity]);
    let idx = 2;
    if (/rain|pour|snow|hail|lightning|fog/.test(c)) idx += 2;
    if (c === 'fog') idx += 1;
    if (a.humidity > 85) idx += 1;
    if (a.wind_speed != null && a.wind_speed < 6) idx += 1;
    if (a.temperature != null && (a.temperature > 30 || a.temperature < -5)) idx += 1;
    const aq = WX.aqi ? parseFloat(values[WX.aqi]) : NaN;
    if (isFinite(aq)) idx += aq > 100 ? 4 : aq > 50 ? 2 : 0;
    idx = Math.max(1, Math.min(10, idx));
    const detail = (a.temperature != null ? Math.round(a.temperature) + '°C · ' : '') + (COND[c] || c) + (a.wind_speed != null ? ' · Wind ' + Math.round(a.wind_speed) : '');
    return {idx, detail};
  }
  function calData(cfg){
    const at = attrs[cfg.entity]; if (!at || !at.message) return null;
    const msg = String(at.message).slice(0,36);
    const st = at.start_time ? new Date(String(at.start_time).replace(' ','T')) : null;
    if (!st || isNaN(st)) return {msg, when:'–', soon:false};
    const now = new Date(), d0 = new Date(now); d0.setHours(0,0,0,0);
    const s0 = new Date(st); s0.setHours(0,0,0,0);
    const dd = Math.round((s0 - d0)/86400000);
    if (dd < 0 && values[cfg.entity] !== 'on') return null;
    const day = dd === 0 ? 'Heute' : dd === 1 ? 'Morgen' : WD[st.getDay()] + ' ' + p2(st.getDate()) + '.' + p2(st.getMonth()+1) + '.';
    const time = at.all_day ? 'ganztägig' : p2(st.getHours()) + ':' + p2(st.getMinutes());
    return {msg, when: day + ' · ' + time, soon: dd <= 1};
  }
  function daysUntil(id){
    const v = values[id]; if (v == null) return null;
    if (/^\d{4}-\d{2}-\d{2}/.test(v)){
      const d = new Date(v.slice(0,10) + 'T00:00:00'), n = new Date(); n.setHours(0,0,0,0);
      return Math.round((d - n)/86400000);
    }
    const num = parseFloat(v); if (isFinite(num)) return Math.round(num);
    const l = String(v).toLowerCase();
    if (/heute|today/.test(l)) return 0;
    if (/morgen|tomorrow/.test(l)) return 1;
    return null;
  }
  const infoEl = $('info');
  const irows = [['Luftqualität',IC.air],['Termin',IC.cal],['Müll',IC.bin],['Werbeblocker',IC.shield]].map(d => {
    const tile = document.createElement('div'); tile.className = 'tile';
    const k = document.createElement('div'); k.className = 'k'; k.innerHTML = d[1]; const kt = document.createElement('span'); kt.textContent = d[0]; k.appendChild(kt);
    const v = document.createElement('div'); v.className = 'v'; v.textContent = '–';
    const dd = document.createElement('div'); dd.className = 'd';
    tile.append(k,v,dd); infoEl.appendChild(tile);
    return {k, v, d:dd};
  });
  function setRow(i, value, detail, cls){
    const r = irows[i]; r.v.textContent = value; r.v.className = 'v' + (cls ? ' ' + cls : ''); r.d.textContent = detail;
  }
  function infoTick(){
    const sm = smogData();
    setRow(0, sm ? sm.idx + ' / 10' : '–', sm ? sm.detail : 'Keine Wetterdaten', sm ? (sm.idx >= 7 ? 'r' : sm.idx >= 5 ? 'w' : '') : '');
    let cal = null;
    for (const c of (CONFIG.calendars || [])){ const x = calData(c); if (x){ cal = x; break; } }
    setRow(1, cal ? cal.when.split(' · ')[0] : '–', cal ? cal.msg + (cal.when.indexOf('·') > 0 ? ' · ' + cal.when.split(' · ')[1] : '') : 'Kein Termin', cal && cal.soon ? 'w' : '');
    const gl = (CONFIG.garbage || []).map(g => ({g, n: daysUntil(g.entity)})).filter(x => x.n != null && x.n >= 0).sort((a,b) => a.n - b.n);
    if (gl.length){
      const f = gl[0], o = gl[1];
      setRow(2, f.n === 0 ? 'Heute' : f.n === 1 ? 'Morgen' : 'in ' + f.n + ' Tagen', f.g.label + (o ? ' · ' + o.g.label + ' in ' + o.n + ' T.' : ''), f.n <= 1 ? 'w' : '');
    } else setRow(2, '–', 'Keine Daten', '');
    const b = parseFloat(values[PH.blocked]), p = parseFloat(values[PH.percent]);
    setRow(3, isFinite(b) ? Math.round(b).toLocaleString('de-DE') : '–', isFinite(p) ? Math.round(p) + ' % geblockt' : 'Keine Daten', '');
  }
  infoTick(); setInterval(infoTick, 2000);

  /* ---------- Pi-Stats ---------- */
  let statsWarned = false;
  const sysEl = $('sys'), SYSDEF = [['cpu','CPU',v=>Math.round(v)+' %',v=>v>90],['ram','RAM',v=>Math.round(v)+' %',v=>v>90],
    ['temp','Temp.',v=>v.toFixed(0)+' °C',v=>v>75],['disk','Disk',v=>Math.round(v)+' %',v=>v>90]];
  const sysCells = SYSDEF.map(d => { const c = document.createElement('div'), s = document.createElement('span'), b = document.createElement('b'); s.textContent = d[1]; b.textContent = '–'; c.append(s,b); sysEl.appendChild(c); return c; });
  function renderSys(){
    $('syscard').style.display = statsOk && stats ? '' : 'none';
    if (!statsOk || !stats) return;
    SYSDEF.forEach((d,i) => { const v = stats[d[0]]; sysCells[i].lastChild.textContent = v != null ? d[2](v) : '–'; sysCells[i].classList.toggle('bad', v != null && d[3](v)); });
    if (stats.uptime != null){ const s = stats.uptime, dd = (s/86400)|0, h = ((s%86400)/3600)|0, m = ((s%3600)/60)|0; $('sysup').textContent = 'Laufzeit ' + (dd ? dd+' T ' + h + ' Std' : h + ' Std ' + m + ' Min'); }
  }
  function pollStats(){
    if (!CONFIG.stats) return;
    fetch(CONFIG.stats, {cache:'no-store'}).then(r => r.json()).then(d => {
      if (!statsOk) push('Pi-Stats verbunden');
      stats = d; statsOk = true; statsWarned = false; renderSys();
    }).catch(() => {
      if (statsOk){ push('Pi-Stats nicht erreichbar','w'); }
      else if (!statsWarned){ statsWarned = true; push('Pi-Stats: python3 pi-stats.py starten','w'); }
      statsOk = false; renderSys();
    });
  }
  if (CONFIG.stats){ pollStats(); setInterval(pollStats, 1000); }

  /* ---------- Netzwerk ---------- */
  const nc = $('nc'), nx = nc.getContext('2d');
  const N = 40;
  let sdv = 55, suv = 25;
  const dn = Array.from({length:N}, () => 200 + Math.random()*180), up = Array.from({length:N}, () => 60 + Math.random()*70);
  function drawNet(){
    const {w:W,h:H,dpr} = fitCanvas(nc); if (W < 8) return;
    nx.setTransform(dpr,0,0,dpr,0,0); nx.clearRect(0,0,W,H);
    const mx = Math.max(1e-6, Math.max.apply(null,dn), Math.max.apply(null,up))*1.15;
    const accent = cssv('--accent'), pink = cssv('--pink'), border = cssv('--border2');
    nx.strokeStyle = border; nx.lineWidth = 1; nx.setLineDash([3,5]); nx.beginPath();
    for (let i=1;i<4;i++){ const y = H*i/4; nx.moveTo(0,y); nx.lineTo(W,y); } nx.stroke(); nx.setLineDash([]);
    const pts = a => a.map((v,i) => [i/(N-1)*W, H - 2 - v/mx*(H-6)]);
    const path = p => { nx.beginPath(); p.forEach((q,i) => { if (!i) nx.moveTo(q[0],q[1]); else { const pr = p[i-1], cx = (pr[0]+q[0])/2; nx.bezierCurveTo(cx,pr[1],cx,q[1],q[0],q[1]); } }); };
    const pd = pts(dn), pu = pts(up);
    path(pd); nx.lineTo(W,H); nx.lineTo(0,H); nx.closePath();
    const gr = nx.createLinearGradient(0,0,0,H); gr.addColorStop(0,withA(accent,.33)); gr.addColorStop(1,withA(accent,0));
    nx.fillStyle = gr; nx.fill();
    path(pd); nx.strokeStyle = accent; nx.lineWidth = 2; nx.lineJoin = 'round'; nx.stroke();
    path(pu); nx.strokeStyle = pink; nx.lineWidth = 1.6; nx.stroke();
  }
  function netTick(){
    let d, u, unit = '', src = 'Simulation';
    const nd = CONFIG.net.down, nu = CONFIG.net.up;
    if (nd && isFinite(parseFloat(values[nd]))){ d = parseFloat(values[nd]); u = parseFloat(values[nu]); if (!isFinite(u)) u = 0; unit = units[nd] || ''; src = 'Router'; }
    else if (statsOk && stats){ d = stats.rx; u = stats.tx; unit = 'kB/s'; src = 'Raspberry Pi'; }
    else {
      sdv = Math.max(6, Math.min(96, sdv + (Math.random()-.5)*28)); suv = Math.max(4, Math.min(80, suv + (Math.random()-.5)*18));
      d = sdv*7.2; u = suv*3.1; unit = 'Mbit/s';
    }
    dn.push(d); dn.shift(); up.push(u); up.shift();
    $('dn').textContent = fmtRate(d,unit); $('up').textContent = fmtRate(u,unit); $('pk').textContent = fmtRate(Math.max.apply(null,dn),unit);
    $('nsrc').textContent = src; drawNet();
  }
  setInterval(netTick, 1000); netTick();

  /* ---------- Echte Alarme ---------- */
  const alarmEl = $('alarm'), alarmItems = $('alarmitems'), alarmfx = $('alarmfx');
  function renderAlarms(){
    alarmItems.textContent = '';
    activeAlarms.forEach(a => {
      const d = document.createElement('div'), b = document.createElement('b'), s = document.createElement('span');
      b.textContent = a.title; s.textContent = a.text + ' · seit ' + a.since; d.append(b,s); alarmItems.appendChild(d);
    });
    const on = activeAlarms.size > 0;
    alarmEl.classList.toggle('show', on); alarmfx.classList.toggle('show', on);
  }
  function alarmOn(a){
    if (activeAlarms.has(a.entity)) return;
    wake(); const d = new Date();
    activeAlarms.set(a.entity, Object.assign({}, a, {since: p2(d.getHours()) + ':' + p2(d.getMinutes())}));
    push('ALARM ' + a.title + ': ' + a.text, 'a'); renderAlarms(); render();
  }
  function alarmOff(id){
    if (!activeAlarms.has(id)) return;
    activeAlarms.delete(id); push('Alarm beendet'); renderAlarms(); render();
  }
  function testAlarm(){
    const a = {entity:'test.alarm', title:'Test', text:'Testalarm ausgelöst', plan:'flur'};
    alarmOn(a); setTimeout(() => alarmOff(a.entity), 8000);
  }

  /* ---------- Türklingel ---------- */
  const doorEl = $('door'), doorFrame = $('doorframe'), doorCd = $('doorcd');
  function hideDoor(){
    doorEl.classList.remove('show'); doorUntil = 0; clearInterval(doorTimer);
    if (doorUrl){ URL.revokeObjectURL(doorUrl); doorUrl = null; }
  }
  doorEl.addEventListener('click', hideDoor);
  function showDoorbell(){
    wake(); hideDoor();
    const secs = DB.seconds || 15;
    doorStart = Date.now(); doorUntil = doorStart + secs*1000;
    const d = new Date(doorStart);
    $('doortime').textContent = p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
    doorFrame.textContent = DB.camera && DB.snapshot ? 'Lade Kamerabild …' : 'Keine Kamera konfiguriert';
    doorEl.classList.add('show'); push('Klingel: Besuch an der Haustür','a');
    doorTimer = setInterval(() => {
      const left = doorUntil - Date.now();
      doorCd.style.width = Math.max(0, left/(secs*1000)*100) + '%';
      if (left <= 0) hideDoor();
    }, 100);
    if (DB.camera && DB.snapshot){
      fetch(DB.snapshot + '?entity=' + encodeURIComponent(DB.camera) + '&t=' + Date.now(), {cache:'no-store'})
        .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.blob(); })
        .then(b => { if (!doorEl.classList.contains('show')) return; doorUrl = URL.createObjectURL(b); const im = new Image(); im.src = doorUrl; im.alt = 'Haustür'; doorFrame.textContent = ''; doorFrame.appendChild(im); })
        .catch(() => { doorFrame.textContent = 'Kein Kamerabild verfügbar'; push('Kamera: kein Bild','w'); });
    }
  }

  /* ---------- Uhr ---------- */
  function tick(){
    const d = new Date();
    $('time').textContent = p2(d.getHours()) + ':' + p2(d.getMinutes());
    $('date').textContent = d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  }
  tick(); setInterval(tick, 1000);

  /* ---------- Zeichenschleife (Grundriss) ---------- */
  let last = 0;
  function loop(t){
    requestAnimationFrame(loop);
    if (t - last < 33) return; last = t;
    drawPlan(t);
  }
  requestAnimationFrame(loop);
  addEventListener('resize', drawNet);
})();
</script>
</body>
</html>
